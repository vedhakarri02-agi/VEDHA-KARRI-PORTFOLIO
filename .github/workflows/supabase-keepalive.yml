name: Supabase Anti-Sleep Keep-Alive

on:
  schedule:
    # Run twice daily at 04:00 and 16:00 UTC (every 12 hours) to ensure Supabase never sleeps
    - cron: '0 4,16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keepalive:
    name: Keep Supabase Free Tier Active
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Ping Supabase Database
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mqnobywvbluuticblnjy.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_NoxTVgBrDQvtuKILs1grQw_W0HBtzfc' }}
        run: node scripts/keepalive.js

      - name: Ping Live Website Keepalive API (if deployed)
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ -n "$SITE_URL" ]; then
            echo "Pinging site endpoint at $SITE_URL/api/keepalive..."
            curl -s -f "$SITE_URL/api/keepalive" || true
          fi
